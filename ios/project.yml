name: ConsumerLawReader
options:
  bundleIdPrefix: io.github.sargon17green
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ConsumerLawReader:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ConsumerLawReader
      - path: ../dist
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sargon17green.consumerlawreader
        PRODUCT_NAME: ConsumerLawReader
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 'חוק הגנת הצרכן, התשמ"א–1981'
        INFOPLIST_KEY_CFBundleName: 'חוק הגנת הצרכן, התשמ"א–1981'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
