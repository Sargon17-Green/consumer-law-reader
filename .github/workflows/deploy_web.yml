name: Publish mobile reader without replacing public alpha
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy_web.yml'
      - 'original/**'
      - 'web/**'
      - 'scripts/**'
      - 'typed-sources/**'
      - 'metadata/**'
      - 'VERSION'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      pages: read
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
      site_commit: ${{ steps.persist.outputs.site_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-qa.txt
      - name: Verify mobile content and public site preservation
        run: |
          python scripts/build_web.py
          python scripts/verify_release.py
          python -m unittest discover -s tests -p 'test_reader_site.py' -v
          python -m unittest discover -s tests -p 'test_public_reader.py' -v
      - name: Read existing Pages configuration without changing it
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > evidence/pages-configuration.json
          MODE=$(jq -r '.build_type' evidence/pages-configuration.json)
          case "$MODE" in
            legacy)
              jq -e '.source.branch == "gh-pages" and .source.path == "/"' evidence/pages-configuration.json
              ;;
            workflow) ;;
            *) echo "Unsupported Pages source; no configuration was changed."; exit 1 ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Read current published site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gh-pages
          path: build/public-site
      - name: Add reader and preserve every existing public file
        run: |
          python scripts/prepare_reader_site.py --bundle dist --site build/public-site --commit "$GITHUB_SHA" | tee evidence/public-site-preservation.json
          python scripts/verify_public_reader.py prepare --commit "$GITHUB_SHA"
      - name: Persist only the owned reader directory without rewriting public history
        id: persist
        run: |
          git -C build/public-site config user.name 'github-actions[bot]'
          git -C build/public-site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C build/public-site add -- reader
          if ! git -C build/public-site diff --cached --quiet; then
            git -C build/public-site commit -m "Publish mobile reader from $GITHUB_SHA at /reader/"
            git -C build/public-site push origin HEAD:gh-pages
          fi
          echo "site_commit=$(git -C build/public-site rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.pages.outputs.mode == 'workflow'
        with:
          path: build/public-site
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: public-site-preservation
          path: |
            evidence/public-site-*.json
            evidence/pages-configuration.json
          retention-days: 90
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://sargon17-green.github.io/consumer-law-reader/reader/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: public-site-preservation
          path: evidence/
      - name: Request a build using the existing branch-based Pages source
        if: needs.build.outputs.mode == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_COMMIT: ${{ needs.build.outputs.site_commit }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > evidence/pages-build-request.json
          for attempt in $(seq 1 60); do
            gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" > evidence/pages-build.json
            if jq -e --arg commit "$SITE_COMMIT" '.status == "built" and .commit == $commit' evidence/pages-build.json; then
              exit 0
            fi
            if jq -e --arg commit "$SITE_COMMIT" '.status == "errored" and .commit == $commit' evidence/pages-build.json; then
              cat evidence/pages-build.json
              exit 1
            fi
            sleep 5
          done
          cat evidence/pages-build.json
          exit 1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: needs.build.outputs.mode == 'workflow'
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: needs.build.outputs.mode == 'workflow'
        id: deployment
      - name: Verify actual public reader bytes, preserved alpha and original APK
        run: python3 scripts/verify_public_reader.py verify
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: public-reader-http-verification
          path: evidence/
          retention-days: 90
