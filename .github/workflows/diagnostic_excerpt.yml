name: Inspect Oreo overlay evidence
on:
  push:
    branches: [qa/mobile-diagnostics-20261108]
permissions:
  contents: read
  actions: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print only provider overlay diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download 42505147390 --name android-emulator-api-26 --dir diagnostics
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in sorted(Path("diagnostics").rglob("*")):
              if not path.is_file(): continue
              if "overlay" in path.name:
                  print("EVIDENCE",path, path.read_text(errors="replace")[-25000:])
              elif "logcat" in path.name:
                  lines=[l for l in path.read_text(errors="replace").splitlines() if re.search(r"overlay|idmap|ReaderQAWebView|webviewprovider",l,re.I)]
                  print("OVERLAY LOG","\n".join(lines)[-28000:])
          PY
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,source}'
