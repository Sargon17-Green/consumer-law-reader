name: Verify pre-signed 1.3.4 build without publishing
on:
  push:
    branches: [release/android-1.3.4]
    paths:
      - .github/workflows/check_signed_beta_134.yml
permissions:
  actions: read
  contents: read
jobs:
  check-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download exact unsigned build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40643846969 --repo "$GITHUB_REPOSITORY" --name unsigned-android-1.3.4-and-apksigner --dir "$RUNNER_TEMP/unsigned"
          test "$(sha256sum "$RUNNER_TEMP/unsigned/build/aligned.apk" | cut -d' ' -f1)" = "a2fc048c0898ec34a407df9db56af2fe3f0c87474beeab9b49a37a58d5e71a37"
      - name: Apply signed public delta and verify signer
        run: |
          python scripts/apply_signed_binary_patch.py "$RUNNER_TEMP/unsigned/build/aligned.apk" releases/android-1.3.4-public-signature-delta.b64 "$RUNNER_TEMP/signed.apk"
          java -jar "$RUNNER_TEMP/unsigned/.toolchain/build-tools-36.0.0/android-16/lib/apksigner.jar" verify --verbose --print-certs "$RUNNER_TEMP/signed.apk" | tee "$RUNNER_TEMP/verify.txt"
          grep -q 'Signer #1 certificate SHA-256 digest: 2625ebe860cb0bfac105196b24aeedf3a948ce18c6f836478fd8ea38d0b937dc' "$RUNNER_TEMP/verify.txt"
