name: Apply the two registry outage editor notes exactly once
on:
  push:
    branches: [fix/registry-unavailable-notes-20261028]
    paths:
      - .github/workflows/apply_registry_notes_once.yml

permissions:
  contents: write

jobs:
  insert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Insert exactly two non-normative notes with SHA-256 guards
        run: |
          set -euo pipefail
          python scripts/add_registry_unavailability_notes.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from add_registry_unavailability_notes import verify
          assert verify(Path('original/Consumer_Protection_Law.html').read_bytes())
          print('Original law and regulation text unchanged except for two exact note blocks')
          PY
      - name: Commit only the guarded HTML source change to this feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- original/Consumer_Protection_Law.html
          git diff --cached --exit-code && { echo 'No change needed'; exit 0; } || true
          git commit -m 'editorial: two registry-unavailable notes at 16ג(ג) and regulation 3(a)'
          git fetch origin fix/registry-unavailable-notes-20261028
          git rebase origin/fix/registry-unavailable-notes-20261028
          git push origin HEAD:fix/registry-unavailable-notes-20261028
