name: Restore exact source bytes on technical fix branch
on:
  push:
    branches: [fix/android-technical-20261028]
    paths: [.github/workflows/restore_original_source.yml]
permissions:
  contents: write
jobs:
  restore-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guarded exact-byte reconstruction
        run: python scripts/restore_original_bytes.py
      - name: Commit only byte-identical original HTML
        run: |
          if ! git diff --quiet -- original/Consumer_Protection_Law.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- original/Consumer_Protection_Law.html
            git commit -m 'fix: preserve original HTML bytes and CRLF exactly'
            git push origin HEAD:fix/android-technical-20261028
          fi
