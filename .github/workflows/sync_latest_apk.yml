name: Maintain permanent latest Android APK download

on:
  release:
    types: [published, edited]
  push:
    branches: [main]
    paths:
      - .github/workflows/sync_latest_apk.yml
      - scripts/sync_latest_download.py
  workflow_dispatch:
  schedule:
    # Backstop for releases published via GITHUB_TOKEN, which do not trigger release workflows.
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: maintain-public-latest-apk
  cancel-in-progress: false

jobs:
  update-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Select newest Android release and verify public APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_latest_download.py
      - name: Commit changed latest.apk and its metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- downloads/latest.apk
          git add -- downloads/latest.json
          if git diff --cached --quiet; then
            echo 'Public download already points at newest release'
            exit 0
          fi
          git commit -m 'downloads: follow newest public Android release'
          # Retry once if main changed concurrently.
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Confirm committed APK matches released asset checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:downloads/latest.json > "$RUNNER_TEMP/latest.json"
          git show origin/main:downloads/latest.apk > "$RUNNER_TEMP/latest.apk"
          python3 - "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/latest.apk" <<'PY'
          import hashlib, json, pathlib, sys
          m=json.loads(pathlib.Path(sys.argv[1]).read_text())
          actual=hashlib.sha256(pathlib.Path(sys.argv[2]).read_bytes()).hexdigest()
          assert actual==m["sha256"], "Stable URL is not the verified latest release APK"
          print(f'Stable APK verified: {m["tag"]} {actual}')
          PY
