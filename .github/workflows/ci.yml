name: Android bounded Activity state regression
on:
  push:
    branches: [work/android-state-cache-20261110]
concurrency:
  group: android-state-cache-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Python QA dependencies
        run: python -m pip install -r requirements-qa.txt
      - name: Acquire Android build tools
        run: python scripts/fetch_tools.py
      - name: Build and test a temporary non-upgradeable Android debug APK
        run: |
          python scripts/build_android.py --debug
          python scripts/verify_release.py --apk "debug-build/Consumer_Law_Reader_$(cat VERSION)_DEBUG_NOT_FOR_UPGRADE.apk"
      - name: Prepare and verify unsigned signing candidate
        run: |
          python scripts/build_android.py --unsigned
          python scripts/verify_release.py --apk "unsigned-build/Consumer_Law_Reader_$(cat VERSION)_UNSIGNED_NOT_INSTALLABLE.apk"
      - name: Validate unsigned Android App Bundle and matching QA APK
        run: python scripts/build_android_bundle.py
      - name: Save debug binary and verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-debug-not-for-upgrade
          path: |
            debug-build/
            unsigned-build/
            evidence/
          retention-days: 30
      - name: Verify debug certificate is not the release identity
        run: |
          if grep -q '2625ebe860cb0bfac105196b24aeedf3a948ce18c6f836478fd8ea38d0b937dc' evidence/apk-verification.txt; then
            echo 'ERROR: debug build accidentally uses release signer'; exit 1
          fi
          echo 'Temporary debug certificate confirmed distinct.'
          python - <<'PY'
          from pathlib import Path
          from scripts.sync_latest_download import verify_release_certificate
          verify_release_certificate(Path('downloads/latest.apk'))
          try:
              verify_release_certificate(next(Path('debug-build').glob('*DEBUG_NOT_FOR_UPGRADE.apk')))
          except RuntimeError:
              print('Public download accepts the existing release and rejects the real debug signer.')
          else:
              raise AssertionError('Debug identity could replace the public upgrade')
          PY
  android-emulator:
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - api: 26
            arch: x86
            target: default
            system-options: -writable-system
          - api: 31
            arch: x86_64
            target: google_apis
          - api: 36
            arch: x86_64
            target: google_apis
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements-qa.txt
      - name: Build real app and platform instrumentation
        run: |
          python scripts/fetch_tools.py
          python scripts/build_android.py --debug
          python scripts/build_android_qa.py
          python scripts/prepare_android_upgrade.py
      - name: Generate bundle-derived APK for real Android 16 installation tests
        if: matrix.api == 36
        run: python scripts/build_android_bundle.py
      - name: Fetch official modern test WebView for the minimum OS
        if: matrix.api == 26
        run: python scripts/fetch_api26_webview.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise actual Android WebView without network
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none ${{ matrix.system-options }}
          disable-animations: true
          script: bash scripts/run_android_emulator_qa.sh ${{ matrix.api }}
      - name: Preserve emulator diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-emulator-api-${{ matrix.api }}
          path: evidence/
          retention-days: 30
