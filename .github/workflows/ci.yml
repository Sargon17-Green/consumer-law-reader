name: Source, web and Android debug integrity
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: mobile-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-and-browser:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-qa.txt
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Build and verify source without signed APK
        run: |
          python scripts/build_web.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/verify_release.py
          python scripts/validate_project_docs.py
      - name: Inspect public Pages source without changing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > evidence/pages-configuration.json
          jq '{build_type,source,html_url}' evidence/pages-configuration.json
          jq -e '.build_type == "workflow" or (.build_type == "legacy" and .source.branch == "gh-pages" and .source.path == "/")' evidence/pages-configuration.json
      - name: Scan current trust policies and full Git history
        run: |
          python scripts/mobile_security_audit.py
          python scripts/run_secret_scan.py
      - name: Check browser scripts
        run: |
          node --check web/mobile-core.js
          node --check web/mobile-settings.js
          node tests/mobile_core_qa.js
          node --check web/mobile.js
          node --check web/mobile-sources.js
          node --check web/mobile-topics.js
          node --check tests/pastafari_widget_qa.js
          node tests/pastafari_widget_qa.js
      - name: Test search and editorial UI at mobile widths
        run: |
          python tests/technical_smoke_134.py
          python tests/pwa_offline_qa.py
          python tests/search_state_qa.py
      - name: Save source verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shared-reader-source-evidence
          path: evidence/
          retention-days: 30
      - name: QA topic navigation against the original document
        run: python tests/topic_navigation_qa.py
  browser-integration:
    name: Bundled browser and accessibility (${{ matrix.width }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        width: [320, 430, 768, 1180]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install pinned interaction and accessibility tools
        run: |
          python -m pip install -r requirements-qa.txt playwright==1.57.0
          python -m playwright install chromium
          npm ci --prefix tests/qa --ignore-scripts --no-audit --no-fund
      - name: Build and verify the same immutable source
        run: |
          python scripts/build_web.py
          python scripts/verify_release.py
      - name: Exercise the full bundled DOM at the assigned screen width
        env:
          LAW_QA_WIDTH: ${{ matrix.width }}
        run: python tests/mobile_integration_qa.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: shared-reader-browser-${{ matrix.width }}
          path: evidence/
          retention-days: 30
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Python QA dependencies
        run: python -m pip install -r requirements-qa.txt
      - name: Acquire Android build tools
        run: python scripts/fetch_tools.py
      - name: Build and test a temporary non-upgradeable Android debug APK
        run: |
          python scripts/build_android.py --debug
          python scripts/verify_release.py --apk "debug-build/Consumer_Law_Reader_$(cat VERSION)_DEBUG_NOT_FOR_UPGRADE.apk"
      - name: Prepare and verify unsigned signing candidate
        run: |
          python scripts/build_android.py --unsigned
          python scripts/verify_release.py --apk "unsigned-build/Consumer_Law_Reader_$(cat VERSION)_UNSIGNED_NOT_INSTALLABLE.apk"
      - name: Validate unsigned Android App Bundle and matching QA APK
        run: python scripts/build_android_bundle.py
      - name: Save debug binary and verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-debug-not-for-upgrade
          path: |
            debug-build/
            unsigned-build/
            evidence/
          retention-days: 30
      - name: Verify debug certificate is not the release identity
        run: |
          if grep -q '2625ebe860cb0bfac105196b24aeedf3a948ce18c6f836478fd8ea38d0b937dc' evidence/apk-verification.txt; then
            echo 'ERROR: debug build accidentally uses release signer'; exit 1
          fi
          echo 'Temporary debug certificate confirmed distinct.'
          python - <<'PY'
          from pathlib import Path
          from scripts.sync_latest_download import verify_release_certificate
          verify_release_certificate(Path('downloads/latest.apk'))
          try:
              verify_release_certificate(next(Path('debug-build').glob('*DEBUG_NOT_FOR_UPGRADE.apk')))
          except RuntimeError:
              print('Public download accepts the existing release and rejects the real debug signer.')
          else:
              raise AssertionError('Debug identity could replace the public upgrade')
          PY
  android-emulator:
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - api: 26
            arch: x86
            target: default
            system-options: -writable-system
          - api: 31
            arch: x86_64
            target: google_apis
          - api: 36
            arch: x86_64
            target: google_apis
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements-qa.txt
      - name: Build real app and platform instrumentation
        run: |
          python scripts/fetch_tools.py
          python scripts/build_android.py --debug
          python scripts/build_android_qa.py
          python scripts/prepare_android_upgrade.py
      - name: Generate bundle-derived APK for real Android 16 installation tests
        if: matrix.api == 36
        run: python scripts/build_android_bundle.py
      - name: Fetch official modern test WebView for the minimum OS
        if: matrix.api == 26
        run: python scripts/fetch_api26_webview.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise actual Android WebView without network
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none ${{ matrix.system-options }}
          disable-animations: true
          script: bash scripts/run_android_emulator_qa.sh ${{ matrix.api }}
      - name: Preserve emulator diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-emulator-api-${{ matrix.api }}
          path: evidence/
          retention-days: 30
