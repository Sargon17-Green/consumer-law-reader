name: Constrained Android actual native flow
on:
  push:
    branches: [work/android-constrained-20261110]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-constrained
  cancel-in-progress: true
jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - api: 26
            arch: x86
            target: default
            system-options: -writable-system
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements-qa.txt
      - name: Build real app and platform instrumentation
        run: |
          python scripts/fetch_tools.py
          python scripts/build_android.py --debug
          python scripts/build_android_qa.py
          python scripts/prepare_android_upgrade.py
      - name: Generate bundle-derived APK for real Android 16 installation tests
        if: matrix.api == 36
        run: python scripts/build_android_bundle.py
      - name: Fetch official modern test WebView for the minimum OS
        if: matrix.api == 26
        run: python scripts/fetch_api26_webview.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise actual Android WebView without network
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          cores: 1
          ram-size: 1536M
          heap-size: 384M
          emulator-options: -no-window -cores 1 -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none ${{ matrix.system-options }}
          disable-animations: true
          script: |
            mkdir -p evidence
            adb shell cat /proc/meminfo > evidence/constrained-guest-meminfo.txt
            adb shell cat /sys/devices/system/cpu/present > evidence/constrained-guest-cpus.txt
            adb shell getprop dalvik.vm.heapsize > evidence/constrained-guest-heap.txt
            python3 -c "import pathlib,re; root=pathlib.Path('evidence'); total=int(re.search(r'MemTotal:\s+(\d+)',(root/'constrained-guest-meminfo.txt').read_text())[1]); assert 1400*1024<total<1600*1024,total; assert (root/'constrained-guest-cpus.txt').read_text().strip()=='0'; print('ACTUAL_CONSTRAINED_HARDWARE: RAM_KB=',total,'CPUS=1')"
            bash scripts/run_android_emulator_qa.sh ${{ matrix.api }}
      - name: Preserve emulator diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-constrained-api26-1core-1point5GB
          path: evidence/
          retention-days: 30
