name: Validate durable engineering checkpoint
on:
  push:
    branches: [work/validate-evidence-checkpoint-20261110]
permissions:
  contents: read
jobs:
  documentation-and-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-qa.txt
      - name: Validate requirements, actual source and regression contracts
        run: |
          python scripts/validate_project_docs.py
          python scripts/build_web.py
          python scripts/verify_release.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          node tests/mobile_core_qa.js
          node tests/pastafari_widget_qa.js
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: durable-checkpoint-source-evidence
          path: evidence/
          retention-days: 30
