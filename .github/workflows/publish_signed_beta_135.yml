name: Publish signed Android beta 1.3.5
on:
  workflow_run:
    workflows: ["Source, web and Android debug integrity"]
    branches: [main]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify new source and version gates
        id: gate
        run: |
          if [ "$(cat VERSION)" != "1.3.5" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -q 'android:versionCode="13" android:versionName="1.3.5"' android/AndroidManifest.xml
          test "$(sha256sum original/Consumer_Protection_Law.html | cut -d' ' -f1)" = "e046bc015b1e1a7c0fe471f821cdbc53ca0b120f343929418ac393d004a424d4"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Fetch unsigned APK from green QA branch build
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40700754654 --repo "$GITHUB_REPOSITORY" --name android-1.3.5-unsigned --dir "$RUNNER_TEMP/unsigned"
          test "$(sha256sum "$RUNNER_TEMP/unsigned/aligned.apk" | cut -d' ' -f1)" = "867b3b608b0841134ed319d7e2f6ad98c31837c30d2947f5d6d2ae72b43bfd8e"
      - name: Reconstruct the exact signed APK
        if: steps.gate.outputs.publish == 'true'
        run: |
          python scripts/apply_signed_binary_patch.py "$RUNNER_TEMP/unsigned/aligned.apk" releases/android-1.3.5-public-signature-delta.b64 Consumer_Law_Reader_1.3.5_Beta_Android.apk
          echo '2772e3d8195de2d9a66edc8cdbc9e0940ac71f8cb55f1597dcc7c122120101af  Consumer_Law_Reader_1.3.5_Beta_Android.apk' > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Verify signed APK with Android tools
        if: steps.gate.outputs.publish == 'true'
        run: |
          python scripts/fetch_tools.py
          java -jar .toolchain/build-tools-36.0.0/android-16/lib/apksigner.jar verify --verbose --print-certs Consumer_Law_Reader_1.3.5_Beta_Android.apk > "$RUNNER_TEMP/verified-signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/verified-signature.txt"
          grep -q 'Signer #1 certificate SHA-256 digest: 2625ebe860cb0bfac105196b24aeedf3a948ce18c6f836478fd8ea38d0b937dc' "$RUNNER_TEMP/verified-signature.txt"
      - name: Publish only new or exactly matching beta asset
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.3.5-beta
          apk=Consumer_Law_Reader_1.3.5_Beta_Android.apk
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release found; verifying rather than overwriting"
          else
            gh release create "$tag" "$apk" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "${{ github.event.workflow_run.head_sha }}" --title 'Android beta 1.3.5' --notes-file BETA_RELEASE_NOTES_HE.md --prerelease
          fi
          mkdir -p "$RUNNER_TEMP/readback"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p "$apk" --dir "$RUNNER_TEMP/readback"
          test "$(sha256sum "$RUNNER_TEMP/readback/$apk" | cut -d' ' -f1)" = "2772e3d8195de2d9a66edc8cdbc9e0940ac71f8cb55f1597dcc7c122120101af"
          echo 'Published APK readback SHA-256 verified'
