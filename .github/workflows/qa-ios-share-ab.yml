name: QA isolated iOS native ShareSheet A/B (experimental only)

# This workflow exists only in the QA experiment branch; it is not a release gate.
# Run the two genuine native presentation routes without Files/Print test traffic.
on:
  push:
    branches: [qa/ios-share-presentation-ab-20261114]
    paths:
      - '.github/workflows/qa-ios-share-ab.yml'
      - 'ios/ConsumerLawReader/ConsumerLawReaderApp.swift'
      - 'ios/ConsumerLawReaderUITests/ReaderUITests.swift'
      - 'ios/scripts/summarize_share_lifecycle.py'
      - 'tests/test_ios_share_lifecycle_summary.py'
      - 'ios/scripts/summarize_share_xctest.py'
      - 'tests/test_ios_share_xctest_summary.py'
      - 'ios/ConsumerLawReaderTests/**'
      - 'ios/project.yml'
      - 'scripts/build_web.py'
  workflow_dispatch:

concurrency:
  group: qa-isolated-ios-share-ab-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  ios-simulator:
    name: Share A/B only — ${{ matrix.family }} iOS ${{ matrix.os }} ${{ matrix.profile || '' }}
    runs-on: macos-15
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - family: iPhone
            os: '18.5'
            archive: false
          - family: iPad
            os: '18.5'
            archive: false
          - family: iPhone
            os: '26.2'
            archive: false
          - family: iPad
            os: '26.2'
            archive: false
          - family: iPhone
            os: '26.2'
            archive: false
            profile: accessibility-xxxl
            text_size: accessibility-extra-extra-extra-large
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select a pinned App Store compatible SDK
        run: |
          test -d /Applications/Xcode_26.3.app
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Install verification dependencies
        run: python3 -m pip install -r requirements-qa.txt
      - name: Build and verify bundled legal text
        run: |
          python3 scripts/build_web.py
          python3 scripts/verify_release.py
          python3 -m unittest discover -s tests -p 'test_web_pages.py' -v
          python3 -m unittest discover -s tests -p 'test_ios_source.py' -v
      - name: Install checksum-pinned XcodeGen 2.46.0
        run: |
          set -euo pipefail
          GENERATOR_ROOT="$RUNNER_TEMP/law-reader-xcodegen-2.46.0"
          mkdir -p "$GENERATOR_ROOT"
          curl --fail --location --retry 2 --max-time 90 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$GENERATOR_ROOT/xcodegen.zip"
          (cd "$GENERATOR_ROOT" && echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip' | shasum -a 256 -c -)
          unzip -q "$GENERATOR_ROOT/xcodegen.zip" -d "$GENERATOR_ROOT"
          echo "$GENERATOR_ROOT/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Record actual build environment
        run: |
          mkdir -p build
          xcodebuild -version > build/ios-environment.txt
          sw_vers >> build/ios-environment.txt
          xcrun simctl list runtimes >> build/ios-environment.txt
          xcodegen --version >> build/ios-environment.txt
      - name: Check whether Apple's minimum-OS simulator can be acquired without an account
        id: minimum-runtime
        if: matrix.os == '16.0'
        run: python3 ios/scripts/acquire_minimum_runtime.py
      - name: Generate native app and icon
        run: |
          bash ios/scripts/prepare_assets.sh
          xcodegen generate --spec ios/project.yml --project ios
      - name: Compile application and UI tests before starting the simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcrun swiftc -frontend -parse ios/ConsumerLawReader/ConsumerLawReaderApp.swift
          xcodebuild \
            -project ios/ConsumerLawReader.xcodeproj \
            -scheme ConsumerLawReader \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing | tee build/ios-build.log
      - name: Verify actual built .app contains the offline legal document
        run: |
          APP="build/ios-derived/Build/Products/Debug-iphonesimulator/ConsumerLawReader.app"
          test -d "$APP"
          test -s "$APP/dist/index.html"
          test -s "$APP/dist/mobile.js"
          test -s "$APP/dist/manifest.webmanifest"
          test -s "$APP/dist/typed-index.js"
          test -s "$APP/dist/PEGI_18_plus.png"
          echo "Built iOS simulator .app includes the original legal text and offline assets."
      - name: Exercise ONLY actual native SwiftUI and UIKit ShareSheet A/B trials
        if: steps.minimum-runtime.outputs.available != 'false'
        env:
          FAMILY: ${{ matrix.family }}
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          export LAW_EXPECT_SEER="$(python3 tests/date_network_probe.py)"
          LABEL="$FAMILY-ios-$OS${{ matrix.profile && format('-{0}', matrix.profile) || '' }}"
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; family,version=sys.argv[1:]; key="com.apple.CoreSimulator.SimRuntime.iOS-"+version.replace(".","-"); print(next(d["udid"] for d in json.load(sys.stdin)["devices"].get(key,[]) if d["name"].startswith(family)))' "$FAMILY" "$OS")"
          echo "QA_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "QA_LABEL=$LABEL" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          PROFILE_TEXT_SIZE="${{ matrix.text_size }}"
          if [[ -n "$PROFILE_TEXT_SIZE" ]]; then
            xcrun simctl ui "$DEVICE" content_size > "build/$LABEL-size-before.txt"
            xcrun simctl ui "$DEVICE" content_size "$PROFILE_TEXT_SIZE"
            xcrun simctl ui "$DEVICE" content_size | tee "build/$LABEL-size-actual.txt"
            grep -Fqi "$PROFILE_TEXT_SIZE" "build/$LABEL-size-actual.txt"
          fi
          xcrun simctl status_bar "$DEVICE" override --time '9:41'
          python3 ios/scripts/configure_simulator_runtime.py "$DEVICE" | tee "build/$LABEL-runtime.json"
          # Fail early on the actual installed app, before XCTest launches its
          # separate test runner. An iPad26.2 CI failure (FrontBoard NotFound)
          # occurred during Xcode's implicit install/launch without running a
          # single UI assertion. Keep this check for all device families, not
          # just the legacy iPhone16 runtime.
          APP="build/ios-derived/Build/Products/Debug-iphonesimulator/ConsumerLawReader.app"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl get_app_container "$DEVICE" io.github.sargon17green.consumerlawreader app
          xcrun simctl launch "$DEVICE" io.github.sargon17green.consumerlawreader
          xcrun simctl terminate "$DEVICE" io.github.sargon17green.consumerlawreader
          # Strict native SwiftUI/UIKit share checks: three paired trials per route.
          # Separate iOS 26+ interior-vs-edge trials are balanced 3:3, additive.
          # Failures remain red; never retry inside a testcase.
          xcodebuild -project ios/ConsumerLawReader.xcodeproj -scheme ConsumerLawReader -destination "platform=iOS Simulator,id=$DEVICE" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 720 \
            -only-testing:ConsumerLawReaderUITests/ReaderUITests/testNativeShareDirectlyAfterColdLaunch \
            -only-testing:ConsumerLawReaderUITests/ReaderUITests/testQAUIKitDirectShareAfterColdLaunch \
            -only-testing:ConsumerLawReaderUITests/ReaderUITests/testQAShareRepeatABSwiftUIFirst \
            -only-testing:ConsumerLawReaderUITests/ReaderUITests/testQAShareRepeatABUIKitFirst \
            -only-testing:ConsumerLawReaderUITests/ReaderUITests/testQAUIKitInteriorOutsideTapAfterColdLaunch \
            -only-testing:ConsumerLawReaderUITests/ReaderUITests/testQAUIKitInteriorOutsideTapRepeatTwo \
            -only-testing:ConsumerLawReaderUITests/ReaderUITests/testQAUIKitInteriorOutsideTapRepeatThree \
            -derivedDataPath build/ios-derived -resultBundlePath "build/$LABEL-tests.xcresult" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "build/$LABEL-tests.log"
      - name: Collect simulator evidence and shut it down after success or failure
        if: always()
        run: |
          if [[ -n "${QA_DEVICE:-}" ]]; then
            xcrun simctl io "$QA_DEVICE" screenshot "build/$QA_LABEL-simulator.png" || true
            if [[ -d "build/$QA_LABEL-tests.xcresult" ]]; then
              xcrun xcresulttool export attachments --path "build/$QA_LABEL-tests.xcresult" --output-path "build/$QA_LABEL-attachments" || true
            fi
            # Collect only this QA app's own opt-in lifecycle trace; never
            # inspect the global device log or export shared document contents.
            APP_DATA="$(xcrun simctl get_app_container "$QA_DEVICE" io.github.sargon17green.consumerlawreader data 2>/dev/null || true)"
            if [[ -n "$APP_DATA" && -f "$APP_DATA/Library/Caches/qa-native-share-lifecycle.log" ]]; then
              cp "$APP_DATA/Library/Caches/qa-native-share-lifecycle.log" "build/$QA_LABEL-share-lifecycle.log"
              echo "QA_SHARE_LIFECYCLE_FILE_CAPTURED"
            else
              echo "QA_SHARE_LIFECYCLE_FILE_UNAVAILABLE" > "build/$QA_LABEL-share-lifecycle.log"
            fi
            # Summarize only events emitted by the opt-in QA app, retaining
            # the original trace for correlation with strict XCTest failures.
            python3 ios/scripts/summarize_share_lifecycle.py \
              "build/$QA_LABEL-share-lifecycle.log" \
              "build/$QA_LABEL-share-lifecycle-summary.json"
            xcrun simctl shutdown "$QA_DEVICE" || true
          fi
      - name: Summarize actual XCTest results without modifying any assertion
        if: always()
        run: |
          mkdir -p build
          shopt -s nullglob
          files=(build/*-tests.log)
          if (( ${#files[@]} == 0 )); then
            python3 ios/scripts/summarize_share_xctest.py \
              build/missing-tests.log build/missing-xctest-summary.json
          else
            for log in "${files[@]}"; do
              python3 ios/scripts/summarize_share_xctest.py \
                "$log" "${log%-tests.log}-xctest-summary.json"
            done
          fi
      - name: Save build report and unsigned simulator binary for QA
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: isolated-share-ab-${{ matrix.family }}-${{ matrix.os }}-${{ matrix.profile || 'standard' }}-evidence
          path: |
            build/ios-build.log
            build/ios-environment.txt
            build/ios-unsigned-archive.log
            build/ConsumerLawReader-unsigned.xcarchive
            build/*-simulator.png
            build/*-tests.log
            build/*-share-lifecycle.log
            build/*-share-lifecycle-summary.json
            build/*-xctest-summary.json
            build/*-runtime.json
            build/*-size-before.txt
            build/*-size-actual.txt
            build/*-tests.xcresult
            build/*-attachments
            build/ios-derived/Build/Products/Debug-iphonesimulator/ConsumerLawReader.app
            evidence/content-manifest.json
            evidence/release-verification.json
            build/ios16-runtime-availability.json
            build/ios16-runtime-acquisition.log
          retention-days: 7
          if-no-files-found: warn
