name: Beta bug report / דיווח תקלה
about: Use for testing the Android and desktop beta
body:
  - type: markdown
    attributes:
      value: |
        תודה על בדיקת הבטא. נא להימנע מהעלאת מידע אישי, צילומי מסך רגישים, סיסמאות או אסימונים.
  - type: dropdown
    id: platform
    attributes:
      label: פלטפורמה
      options: [Android APK, Desktop Windows, Desktop macOS, Desktop Linux, PWA browser]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: גרסה
      value: 1.3.0-beta.1
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: היכן בחוק?
      description: מספר סעיף/כותרת/שם תקנה, אם רלוונטי
  - type: textarea
    id: steps
    attributes:
      label: שלבים לשחזור
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: התנהגות צפויה
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: התנהגות בפועל
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: פרטיות
      options:
        - label: בדקתי שהדיווח אינו מכיל מידע אישי או סודות.
          required: true
